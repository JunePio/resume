<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="이준영 밤숲과 다섯 개의 촛불 파비콘">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#121D28" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="candleBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8CEBE"/>
      <stop offset="55%" stop-color="#F5F0E6"/>
      <stop offset="100%" stop-color="#B6AA96"/>
    </linearGradient>
    <linearGradient id="brassHolder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C6B3B"/>
      <stop offset="50%" stop-color="#DFB97E"/>
      <stop offset="100%" stop-color="#7B5C2E"/>
    </linearGradient>
    <linearGradient id="outerFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Midnight rounded square -->
  <rect width="64" height="64" rx="14" fill="#060911"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" fill="none" stroke="#C59B5F" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Warm ambient halo -->
  <circle cx="32" cy="24" r="24" fill="url(#bgGlow)"/>

  <!-- Subtle dark pine silhouettes at bottom -->
  <path d="M5 56 L11 43 L17 56 Z M47 56 L53 42 L59 56 Z" fill="#0C1420" opacity="0.85"/>

  <!-- Flame (3 layers: outer #EA580C, inner #FBBF24, core #FFFDF5) -->
  <path d="M32 10 C36.2 16.2, 38.6 21.8, 37.6 25.8 C36.8 29.0, 34.6 30.6, 32 30.6 C29.4 30.6, 27.2 29.0, 26.4 25.8 C25.4 21.8, 27.8 16.2, 32 10 Z" fill="url(#outerFlame)"/>
  <path d="M32 14.5 C34.6 18.8, 35.8 22.4, 35.2 25.2 C34.7 27.4, 33.4 28.8, 32 28.8 C30.6 28.8, 29.3 27.4, 28.8 25.2 C28.2 22.4, 29.4 18.8, 32 14.5 Z" fill="#FBBF24"/>
  <ellipse cx="32" cy="24.5" rx="1.9" ry="3.6" fill="#FFFDF5"/>

  <!-- Wick -->
  <line x1="32" y1="29.5" x2="32" y2="33" stroke="#2D1E12" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Candle wax body -->
  <rect x="25.5" y="33" width="13" height="17" rx="2" fill="url(#candleBody)"/>
  <ellipse cx="32" cy="33.3" rx="6.5" ry="1.8" fill="#FFFDF5" opacity="0.72"/>

  <!-- Antique brass candle cup & base -->
  <path d="M21 49.5 L43 49.5 L40.5 53 L23.5 53 Z" fill="url(#brassHolder)"/>
  <rect x="19" y="53" width="26" height="3.2" rx="1.6" fill="url(#brassHolder)"/>
</svg>
